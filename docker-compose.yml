# SiteHub entry container: Traefik reverse proxy with automatic
# Let's Encrypt wildcard certificates (Cloudflare DNS-01).
#
# Instance-specific values come from .env (see .env.example).
# The "proxy" network must exist before starting: docker network create proxy
# (scripts/install.sh does this for you).

services:
  traefik:
    image: traefik:v3.7
    container_name: traefik
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Read-only Docker socket for container auto-discovery.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Static configuration template and its renderer: Traefik does not
      # expand ${...} in its config file, so the template is rendered into
      # /etc/traefik/traefik.yml at container start (see entrypoint below).
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml.tmpl:ro
      - ./traefik/render-config.sh:/render-config.sh:ro
      # Dynamic routes for VPN sites (file provider); hot-reloaded.
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
      # ACME storage (wildcard certificate + account key); survives
      # container re-creation.
      - letsencrypt:/letsencrypt
    # Render the configuration template, then exec Traefik.
    entrypoint: ["/bin/sh", "/render-config.sh"]
    environment:
      DOMAIN: ${DOMAIN}
      LE_EMAIL: ${LE_EMAIL}
      CF_DNS_API_TOKEN: ${CF_DNS_API_TOKEN}
      LE_CA_SERVER: ${LE_CA_SERVER}
      TZ: ${TZ}
    networks:
      - proxy
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  proxy:
    external: true

volumes:
  letsencrypt:
